# =============================================================================
# Netlify Configuration for steplearn
# Platform: https://github.com/website-me-1996/learnstep.git
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --prefer-offline"

# -----------------------------------------------------------------------------
# SPA Routing: Fallback non-file paths to /index.html with HTTP 200
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# Global Security & Cross-Origin Isolation (WebContainer Prerequisite)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noai, noimageai, noarchive"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; frame-src 'self' blob: data: https://*.webcontainer.io; object-src 'none'; base-uri 'self';"

# -----------------------------------------------------------------------------
# MIME-Type & Cache for robots.txt
# -----------------------------------------------------------------------------
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# -----------------------------------------------------------------------------
# Immutable Caching for Vite Hashed Chunks
# -----------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# -----------------------------------------------------------------------------
# Revalidation Caching for Unbundled Curriculum Scripts
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
